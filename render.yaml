# Render Blueprint: 햇빛구 육아용품 대여실 백엔드 (Level 2)
# 형식: https://render.com/docs/blueprint-spec
#
# - Level 2 전용 DB를 씁니다. Level 1 DB(baby-rental-db)와 서비스(baby-rental-api)는 사용하지 않습니다.
#   DB를 어디에 만들지는 아직 정해지지 않았습니다(승인 전). 정해지면 이 파일을 고칩니다.
# - DATABASE_URL은 Level 2 DB의 접속 주소를 Blueprint를 처음 적용할 때 붙여 넣습니다.
# - 무료 웹 서비스는 preDeployCommand를 쓸 수 없어서, 서버 시작 직전에 마이그레이션을 실행합니다.
#   (이미 적용된 마이그레이션은 건너뛰므로 기존 데이터는 그대로입니다.)
# - 비밀값(DB 주소, 비밀번호, API 키)은 이 파일에 적지 않습니다.

services:
  - type: web
    name: baby-rental-level2-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    # 테이블 생성·변경(마이그레이션)을 먼저 적용한 뒤 서버를 켭니다.
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Level 2 전용 DB의 접속 주소. 처음 Blueprint를 만들 때 Render가 입력을 요청합니다.
      - key: DATABASE_URL
        sync: false
      # Vercel 프론트엔드 주소 (쉼표로 여러 개 가능). 처음 Blueprint를 만들 때 입력합니다.
      - key: FRONTEND_ORIGIN
        sync: false
